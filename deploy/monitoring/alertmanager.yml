# Alertmanager 설정 — 심각도별 라우팅 예시(Slack).
# Alertmanager 는 YAML 내 ${ENV} 치환을 지원하지 않으므로 api_url_file 시크릿 마운트를 사용한다.
global:
  resolve_timeout: 5m

route:
  receiver: 'slack-warning'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: [severity="critical"]
      receiver: 'slack-critical'
      repeat_interval: 1h

receivers:
  - name: 'slack-warning'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#dimol-alerts'
        title: '[{{ .Status }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  - name: 'slack-critical'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#dimol-oncall'
        title: '🚨 [{{ .Status }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
