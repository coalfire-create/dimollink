# Alertmanager 설정 — 심각도별 라우팅 예시(Slack).
# 실제 웹훅 URL 등 시크릿은 파일이 아니라 환경변수/시크릿 매니저로 주입한다.
global:
  resolve_timeout: 5m

route:
  receiver: 'slack-warning'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: [severity="critical"]
      receiver: 'slack-critical'
      repeat_interval: 1h

receivers:
  - name: 'slack-warning'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}' # 환경변수로 주입
        channel: '#dimol-alerts'
        title: '[{{ .Status }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  - name: 'slack-critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#dimol-oncall'
        title: '🚨 [{{ .Status }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
