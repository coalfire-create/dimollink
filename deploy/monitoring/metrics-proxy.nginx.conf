# 메트릭 스크레이프용 리버스 프록시
# Prometheus 는 스크레이프 시 임의 헤더(x-admin-token)를 넣을 수 없으므로,
# 이 nginx 가 내부에서 헤더를 주입해 실제 API 의 /api/metrics 로 전달한다.
# ADMIN_TOKEN 은 이 프록시에만 두고 Prometheus 에는 노출하지 않는다.
# 프록시는 내부 네트워크에만 노출한다(공개 금지).

server {
  listen 9145;

  location /api/metrics {
    proxy_set_header x-admin-token "${ADMIN_TOKEN}";  # envsubst 로 주입
    proxy_pass https://api.dimol.example/api/metrics;
    proxy_ssl_server_name on;
  }

  # 그 외 경로 차단.
  location / { return 404; }
}
